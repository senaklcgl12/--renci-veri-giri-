<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öğrenci Veri Giriş Formu</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="form-card">
            <h1>Öğrenci Veri Giriş Formu</h1>
            <p class="aciklama">Lütfen öğrenci bilgilerini eksiksiz şekilde giriniz.</p>

            <form id="ogrenciForm">
                <div class="form-group">
                    <label for="adSoyad">Ad Soyad</label>
                    <input type="text" id="adSoyad" placeholder="Ad Soyad giriniz">
                </div>

                <div class="form-group">
                    <label for="ogrNo">Öğrenci Numarası</label>
                    <input type="text" id="ogrNo" placeholder="Öğrenci numarası giriniz">
                </div>

                <div class="form-group">
                    <label for="bolum">Bölüm</label>
                    <input type="text" id="bolum" placeholder="Bölüm giriniz">
                </div>

                <div class="form-group">
                    <label for="sinif">Sınıf</label>
                    <select id="sinif">
                        <option value="">Sınıf seçiniz</option>
                        <option>1. Sınıf</option>
                        <option>2. Sınıf</option>
                        <option>3. Sınıf</option>
                        <option>4. Sınıf</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="dogumTarihi">Doğum Tarihi</label>
                    <input type="date" id="dogumTarihi">
                </div>

                <div class="form-group">
                    <label for="cinsiyet">Cinsiyet</label>
                    <select id="cinsiyet">
                        <option value="">Cinsiyet seçiniz</option>
                        <option>Kadın</option>
                        <option>Erkek</option>
                        <option>Belirtmek istemiyorum</option>
                    </select>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn kaydet">Kaydet</button>
                    <button type="reset" class="btn temizle">Temizle</button>
                </div>
            </form>

            <p id="mesaj"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
