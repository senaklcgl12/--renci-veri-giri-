<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öğrenci Başarı Takip Sistemi</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <header>
            <h1>Öğrenci Başarı Takip Sistemi</h1>
            <p>Öğrenci, veli, sınav sonucu ve çalışma tavsiyesi yönetim ekranı</p>
        </header>

        <section class="grid">
            <div class="card">
                <h2>Öğrenci Bilgi Formu</h2>
                <input type="text" placeholder="Öğrenci adı soyadı">
                <input type="text" placeholder="Öğrenci numarası">
                <input type="text" placeholder="Bölüm / Sınıf">
                <button>Öğrenci Kaydet</button>
            </div>

            <div class="card">
                <h2>Veli Bilgi Formu</h2>
                <input type="text" placeholder="Veli adı soyadı">
                <input type="text" placeholder="Telefon numarası">
                <select>
                    <option>Yakınlık seçiniz</option>
                    <option>Anne</option>
                    <option>Baba</option>
                    <option>Diğer</option>
                </select>
                <button>Veli Kaydet</button>
            </div>

            <div class="card">
                <h2>Deneme Sınavı Sonuç Girişi</h2>
                <input id="ogrenciAd" type="text" placeholder="Öğrenci adı">
                <input id="matematik" type="number" placeholder="Matematik neti">
                <input id="turkce" type="number" placeholder="Türkçe neti">
                <input id="fen" type="number" placeholder="Fen neti">
                <button onclick="sonucEkle()">Sonucu Kaydet</button>
            </div>

            <div class="card">
                <h2>Çalışma Tavsiyesi</h2>
                <textarea id="tavsiye" placeholder="Öğrenciye özel çalışma tavsiyesi burada görünecek..."></textarea>
                <button> Tavsiyeyi Kaydet</button>
            </div>
        </section>

        <section class="card table-card">
            <h2>Başarı Raporu</h2>
            <table>
                <thead>
                    <tr>
                        <th>Öğrenci</th>
                        <th>Matematik</th>
                        <th>Türkçe</th>
                        <th>Fen</th>
                        <th>Durum</th>
                    </tr>
                </thead>
                <tbody id="raporTablosu">

                </tbody>

                </tr>
                </tbody>
            </table>
        </section>
    </div>

    <script src="script.js"></script>
</body>

</html>
